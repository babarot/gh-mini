version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath

archives:
  # Raw binaries for gh extension install (requires {name}_{os}-{arch} pattern)
  - formats: ["binary"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}-
      {{- .Arch }}

changelog:
  use: github-native

release:
  prerelease: auto
  draft: false
  footer: >-
    ### Installation

    - `gh extension install babarot/gh-mini`

    - `go install github.com/babarot/gh-mini@{{ .Tag }}`
