version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath

archives:
  # Raw binaries for gh extension install (requires {name}_{os}-{arch} pattern)
  - id: gh-extension
    formats: ["binary"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}-
      {{- .Arch }}

  # For the Nix package, which needs an archive
  - id: nix
    formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

changelog:
  use: github-native

release:
  prerelease: auto
  draft: false
  footer: >-
    ### Installation

    - `gh extension install babarot/gh-mini`

    - `go install github.com/babarot/gh-mini@{{ .Tag }}`

    - [Nix](https://nixos.org/): `nix profile install github:babarot/nur-packages#gh-mini`

# Writes pkgs/gh-mini/default.nix to babarot/nur-packages, which builds the
# package from the tar.gz archives above
nix:
  - ids: [nix]
    repository:
      owner: babarot
      name: nur-packages
      token: "{{ .Env.NUR_GITHUB_TOKEN }}"
    homepage: https://github.com/babarot/gh-mini
    description: A small, local GitHub for a directory of Markdown
    license: mit
    main_program: gh-mini
