name: Test

# On main, Release runs this before it releases
on:
  pull_request:
    # What tagpr's pull request changes, released only once this passes on
    # main; its runs wait for an approval anyway, made with GITHUB_TOKEN
    paths-ignore:
      - CHANGELOG.md
      - internal/version/version.go
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go list ./... | grep -v /e2e$ | xargs go test -race
      # The browser tests run after the others, so that Chrome starts on a
      # runner not busy with them
      - run: go test -race ./e2e
        env:
          # The browser tests in e2e fail rather than skip without Chrome
          GH_MINI_E2E: "1"
      - run: go mod tidy -diff
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
