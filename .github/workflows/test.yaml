name: Test

# On main, Release runs this before it releases
on:
  pull_request:
    # What tagpr's pull request changes, released only once this passes on
    # main; its runs wait for an approval anyway, made with GITHUB_TOKEN
    paths-ignore:
      - CHANGELOG.md
      - internal/version/version.go
  schedule:
    # Weekly, to catch newly published vulnerabilities with govulncheck
    - cron: '0 0 * * 1'
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # octocov comments the coverage on the pull request, and keeps the
      # report of main as an artifact to compare the next ones with
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.18
      - run: mise run test
        env:
          # The browser tests in e2e fail rather than skip without Chrome
          GH_MINI_E2E: "1"
      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.18
      - run: mise run lint

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.18
      - run: mise run vuln
