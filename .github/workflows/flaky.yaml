name: Flaky

# The browser tests, run a few times over, to find those that fail now and
# then: one run, as Test does for a pull request, may pass them by chance
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - e2e/**
      - internal/server/assets/**

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=3 ./e2e
        env:
          GH_MINI_E2E: "1"
